name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: vars
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION="${LATEST#v}"
          IFS='.' read -r major minor patch <<< "$VERSION"
          NEW_TAG="v${major}.${minor}.$((patch + 1))"
          echo "Bumping $LATEST → $NEW_TAG"
          echo "TAG=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: services/api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bosun-api:${{ steps.vars.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bosun-api:latest

      - name: Build and push controller
        uses: docker/build-push-action@v6
        with:
          context: services/controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bosun-controller:${{ steps.vars.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bosun-controller:latest

      - name: Build and push runner
        uses: docker/build-push-action@v6
        with:
          context: services/runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bosun-runner:${{ steps.vars.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bosun-runner:latest

      - name: Build and push ui
        uses: docker/build-push-action@v6
        with:
          context: services/ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bosun-ui:${{ steps.vars.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bosun-ui:latest

      - name: Create Git tag
        env:
          TAG: ${{ steps.vars.outputs.TAG }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG
          git push origin $TAG
