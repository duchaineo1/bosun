server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the api service so the UI can use relative paths
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE: disable buffering so log stream works
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
