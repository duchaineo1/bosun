apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bosun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: api
        image: ghcr.io/duchaineo1/bosun-api:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: bosun-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bosun-secrets
              key: db-password
        - name: DATABASE_URL
          value: postgres://$(DB_USER):$(DB_PASSWORD)@postgres:5432/awxng
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: bosun-secrets
              key: jwt-secret
        - name: DEFAULT_RUNNER_IMAGE
          value: ghcr.io/duchaineo1/bosun-runner:latest
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bosun
spec:
  selector:
    app: api
  ports:
  - port: 8080
