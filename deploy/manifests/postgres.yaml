apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: bosun
data:
  001_init.sql: |
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

    CREATE TABLE users (
        id            UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
        username      TEXT        UNIQUE NOT NULL,
        password_hash TEXT        NOT NULL,
        created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE job_templates (
        id          UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
        name        TEXT        NOT NULL,
        description TEXT        NOT NULL DEFAULT '',
        image       TEXT,
        playbook    TEXT        NOT NULL DEFAULT '/playbooks/sample.yml',
        extra_vars  JSONB       NOT NULL DEFAULT '{}',
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE jobs (
        id            UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
        template_id   UUID        REFERENCES job_templates(id) ON DELETE SET NULL,
        status        TEXT        NOT NULL DEFAULT 'pending',
        image_used    TEXT        NOT NULL,
        playbook      TEXT        NOT NULL,
        extra_vars    JSONB       NOT NULL DEFAULT '{}',
        k8s_job_name  TEXT,
        started_at    TIMESTAMPTZ,
        finished_at   TIMESTAMPTZ,
        created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE job_logs (
        id         BIGSERIAL   PRIMARY KEY,
        job_id     UUID        NOT NULL REFERENCES jobs(id) ON DELETE CASCADE,
        line_num   INTEGER     NOT NULL,
        content    TEXT        NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX idx_job_logs_job ON job_logs(job_id, line_num);
  002_git_source.sql: |
    ALTER TABLE job_templates
        ADD COLUMN IF NOT EXISTS git_url TEXT,
        ADD COLUMN IF NOT EXISTS git_ref TEXT NOT NULL DEFAULT 'main';

    ALTER TABLE jobs
        ADD COLUMN IF NOT EXISTS git_url TEXT,
        ADD COLUMN IF NOT EXISTS git_ref TEXT;
  003_credentials.sql: |
    CREATE TABLE credentials (
        id         UUID        PRIMARY KEY DEFAULT gen_random_uuid(),
        name       TEXT        NOT NULL UNIQUE,
        type       TEXT        NOT NULL DEFAULT 'pat',
        data       JSONB       NOT NULL DEFAULT '{}',
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    ALTER TABLE job_templates
        ADD COLUMN IF NOT EXISTS credential_id UUID REFERENCES credentials(id) ON DELETE SET NULL;

    ALTER TABLE jobs
        ADD COLUMN IF NOT EXISTS credential_id UUID;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bosun
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bosun
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_DB
          value: awxng
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: bosun-secrets
              key: db-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bosun-secrets
              key: db-password
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: init
        configMap:
          name: postgres-init
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
