apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: bosun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
    spec:
      serviceAccountName: bosun-controller
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: controller
        image: ghcr.io/duchaineo1/bosun-controller:latest
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: bosun-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bosun-secrets
              key: db-password
        - name: DATABASE_URL
          value: postgres://$(DB_USER):$(DB_PASSWORD)@postgres:5432/awxng
        - name: RUNNER_NAMESPACE
          value: bosun
        - name: DEFAULT_RUNNER_IMAGE
          value: ghcr.io/duchaineo1/bosun-runner:latest
        - name: IMAGE_PULL_SECRET
          value: ghcr-pull-secret
        - name: CREDENTIALS_KEY
          valueFrom:
            secretKeyRef:
              name: bosun-secrets
              key: credentials-key
