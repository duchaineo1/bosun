# Edit values before applying.
apiVersion: v1
kind: Secret
metadata:
  name: bosun-secrets
  namespace: bosun
type: Opaque
stringData:
  db-user: awxng
  db-password: changeme
  jwt-secret: changeme-use-a-real-secret
---
# GHCR pull secret — create with:
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username> \
#     --docker-password=<PAT with read:packages> \
#     --namespace=bosun
#
# Or apply this manifest after filling in the base64-encoded .dockerconfigjson:
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: bosun
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_WITH_BASE64_DOCKERCONFIGJSON
