apiVersion: v1
kind: ServiceAccount
metadata:
  name: bosun-controller
  namespace: bosun
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bosun-controller
  namespace: bosun
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bosun-controller
  namespace: bosun
subjects:
- kind: ServiceAccount
  name: bosun-controller
  namespace: bosun
roleRef:
  kind: Role
  name: bosun-controller
  apiGroup: rbac.authorization.k8s.io
