apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bosuncredentials.bosun.io
spec:
  group: bosun.io
  names:
    kind: BosunCredential
    plural: bosuncredentials
    singular: bosuncredential
    shortNames: [bcred]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [type, secretRef]
              properties:
                type:
                  type: string
                  enum: [pat, github_app, ssh_key]
                secretRef:
                  type: string
                  description: |
                    Name of the K8s Secret in the same namespace containing the credential values.
                    Keys by type:
                      pat:        token
                      github_app: app_id, installation_id, private_key
                      ssh_key:    private_key, passphrase (optional)
