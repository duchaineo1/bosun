apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bosunorganizations.bosun.io
spec:
  group: bosun.io
  names:
    kind: BosunOrganization
    plural: bosunorganizations
    singular: bosunorganization
    shortNames: [borg]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  description: Human-readable display name. Defaults to metadata.name.
                teams:
                  type: array
                  items:
                    type: object
                    required: [slug, name]
                    properties:
                      slug:
                        type: string
                      name:
                        type: string
                      members:
                        type: array
                        description: Usernames of team members (users must exist via API first).
                        items:
                          type: string
                      permissions:
                        type: array
                        items:
                          type: object
                          required: [resource, verbs]
                          properties:
                            resource:
                              type: string
                              enum: [template, credential, job]
                            verbs:
                              type: array
                              items:
                                type: string
                                enum: [read, write, execute, delete]
